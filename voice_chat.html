<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Chat (Piper)</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f0;
      --ink: #14201a;
      --muted: #5c6b63;
      --card: #fff;
      --line: #d8e0db;
      --accent: #1f6feb;
      --listen: #c62828;
      --accent-ink: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: linear-gradient(160deg, #e8f0ec, var(--bg));
      color: var(--ink);
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 1.75rem; margin: 0 0 6px; }
    p.lead { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .log {
      min-height: 220px;
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 92%;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .bubble.user { align-self: flex-end; background: #e3f2fd; }
    .bubble.assistant { align-self: flex-start; background: #f1f8e9; }
    .bubble.system { align-self: center; background: #f5f5f5; color: var(--muted); font-size: 0.85rem; }
    .controls { text-align: center; }
    .mic {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font: 600 0.9rem/1.1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(31, 111, 235, 0.25);
    }
    .mic.listening { background: var(--listen); animation: pulse 1.2s ease-in-out infinite; }
    .mic:disabled { opacity: 0.55; cursor: not-allowed; animation: none; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .status { margin-top: 12px; color: var(--muted); min-height: 1.4em; font-size: 0.9rem; }
    .status.error { color: #9b2c2c; }
    .meta { font-size: 0.82rem; color: var(--muted); margin-top: 8px; }
    select {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      width: 100%;
      max-width: 280px;
    }
    label { font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Voice chat</h1>
    <p class="lead">Piper speaks the replies. Tap the mic to talk, tap again when you finish. After the bot answers, the mic opens again.</p>
    <section class="panel log" id="log" aria-live="polite"></section>
    <section class="panel controls">
      <label for="voice">Piper voice</label><br />
      <select id="voice">
        <option value="en_US-lessac-medium">Lessac (US female)</option>
        <option value="en_US-ryan-medium">Ryan (US male)</option>
        <option value="en_GB-cori-medium">Cori (UK female)</option>
      </select>
      <div style="margin-top: 20px;">
        <button type="button" class="mic" id="mic" disabled>Start</button>
      </div>
      <div class="status" id="status">Checking microphone and speech recognition…</div>
      <div class="meta">Needs Chrome or Edge for speech-to-text. Replies use Ollama + Piper only.</div>
    </section>
  </main>
  <script>
    const log = document.getElementById("log");
    const mic = document.getElementById("mic");
    const status = document.getElementById("status");
    const voice = document.getElementById("voice");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;
    let busy = false;
    let messages = [];
    let player = new Audio();

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function setStatus(text, isError) {
      status.textContent = text;
      status.className = isError ? "status error" : "status";
    }

    function setMicLabel() {
      if (busy) {
        mic.textContent = "Wait";
        mic.classList.remove("listening");
        return;
      }
      if (listening) {
        mic.textContent = "Stop";
        mic.classList.add("listening");
      } else {
        mic.textContent = "Speak";
        mic.classList.remove("listening");
      }
    }

    async function sendTurn(userText) {
      busy = true;
      mic.disabled = true;
      setMicLabel();
      setStatus("Thinking and synthesizing with Piper…");
      addBubble("user", userText);
      const response = await fetch("/api/voice-chat/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages,
          user_text: userText,
          voice: voice.value,
        }),
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(detail || response.statusText);
      }
      const payload = await response.json();
      messages = payload.messages || messages;
      addBubble("assistant", payload.assistant_text);
      const bytes = Uint8Array.from(atob(payload.audio_wav_base64), (c) => c.charCodeAt(0));
      const blob = new Blob([bytes], { type: "audio/wav" });
      player.src = URL.createObjectURL(blob);
      setStatus("Speaking…");
      await player.play();
    }

    function startListening() {
      if (busy || listening || !recognition) return;
      listening = true;
      setMicLabel();
      setStatus("Listening… tap Stop when you are done.");
      recognition.start();
    }

    function stopListening() {
      if (!listening || !recognition) return;
      listening = false;
      setMicLabel();
      setStatus("Processing your speech…");
      recognition.stop();
    }

    mic.addEventListener("click", () => {
      if (busy) return;
      if (listening) stopListening();
      else startListening();
    });

    player.addEventListener("ended", () => {
      busy = false;
      mic.disabled = false;
      setMicLabel();
      setStatus("Your turn. Tap Speak when ready.");
      startListening();
    });

    if (!SpeechRecognition) {
      setStatus("Speech recognition is not available in this browser. Use Chrome or Edge.", true);
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript.trim();
        listening = false;
        setMicLabel();
        if (!text) {
          busy = false;
          mic.disabled = false;
          setStatus("No speech heard. Tap Speak to try again.");
          return;
        }
        try {
          await sendTurn(text);
        } catch (error) {
          busy = false;
          mic.disabled = false;
          setMicLabel();
          setStatus(error.message || "Something went wrong.", true);
        }
      };
      recognition.onerror = (event) => {
        listening = false;
        busy = false;
        mic.disabled = false;
        setMicLabel();
        setStatus(event.error === "no-speech" ? "No speech detected. Tap Speak again." : event.error, true);
      };
      recognition.onend = () => {
        if (listening) {
          listening = false;
          setMicLabel();
        }
      };
      mic.disabled = false;
      addBubble("system", "Voice chat ready. Tap Speak, say something, then tap Stop.");
      setStatus("Tap Speak to start.");
      setMicLabel();
    }
  </script>
</body>
</html>
